name: Release Pipeline

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Compile stack.exe
        shell: powershell
        run: |
          Write-Host "Installing ps2exe..."
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber
          
          Write-Host "Running pre-compiler to bundle scripts..."
          .\.github\build-exe.ps1
          
          Write-Host "Compiling .\stack-monolithic.ps1 to stack.exe..."
          Invoke-ps2exe -InputFile .\stack-monolithic.ps1 -OutputFile .\stack.exe -RequireAdmin:$false -NoConfigFile -Verbose
          
          if (-not (Test-Path .\stack.exe)) {
              Write-Error "Compilation failed!"
              exit 1
          }
          Write-Host "Compilation successful!"

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build gui.exe
        shell: powershell
        run: |
          cd omni-gui
          npm install
          npm run tauri build

      - name: Prepare Release Artifacts
        shell: powershell
        run: |
          Write-Host "Zipping release payload..."
          Copy-Item .\omni-gui\src-tauri\target\release\omni-gui.exe -Destination .\gui.exe
          Compress-Archive -Path .\stack.exe, .\gui.exe, .\config, .\compose -DestinationPath .\docker-omni-stack-release.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: .\docker-omni-stack-release.zip

      - name: Upload Artifact (For Manual Runs)
        uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          name: docker-omni-stack-release
          path: .\docker-omni-stack-release.zip
