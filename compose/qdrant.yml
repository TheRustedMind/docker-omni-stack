services:
  qdrant:
    image: qdrant/qdrant
    container_name: ${QDRANT_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${VOL_QDRANT_DATA:-${PROJECT_DATA_DIR:-../data}/qdrant}:/qdrant/storage

    networks:
      - ai-network

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:6333/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  qdrant_data:
