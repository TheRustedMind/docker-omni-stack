services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ${OPEN_WEBUI_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    volumes:
      - ${VOL_OPENWEBUI_DATA:-${PROJECT_DATA_DIR:-../data}/open-webui}:/app/backend/data
    ports:
      - "${OPEN_WEBUI_HOST_PORT}:8080"
    networks:
      - project-network

volumes:
  openwebui_data:
