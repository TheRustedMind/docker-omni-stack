services:
  caddy:
    image: caddy:latest
    container_name: ${CADDY_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - GLOBAL_API_KEY=${GLOBAL_API_KEY}
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
    volumes:
      - ${PROJECT_APPS_DIR:-../apps}/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${VOL_CADDY_DATA:-${PROJECT_DATA_DIR:-../data}/caddy/data}:/data
      - ${VOL_CADDY_CONFIG:-${PROJECT_DATA_DIR:-../data}/caddy/config}:/config
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  core-network:
    name: ${PROJECT_NETWORK_PREFIX:-project}-core-network
    driver: bridge
