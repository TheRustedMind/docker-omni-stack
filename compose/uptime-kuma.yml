services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ${UPTIME_KUMA_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${VOL_UPTIMEKUMA_DATA:-${PROJECT_DATA_DIR:-../data}/uptime-kuma}:/app/data

    networks:
      - monitoring-network

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:3001/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  uptimekuma_data:
