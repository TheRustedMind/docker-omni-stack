services:
  hoppscotch:
    image: hoppscotch/hoppscotch:latest
    container_name: ${HOPPSCOTCH_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hoppscotch_db"
      DATA_ENCRYPTION_KEY: ${HOPPSCOTCH_DATA_ENCRYPTION_KEY}
      WHITELISTED_ORIGINS: ${HOPPSCOTCH_WHITELISTED_ORIGINS}
      JWT_SECRET: ${HOPPSCOTCH_JWT_SECRET}
      SESSION_SECRET: ${HOPPSCOTCH_SESSION_SECRET}
      VITE_BASE_URL: ${HOPPSCOTCH_VITE_BASE_URL}

    networks:
      - tools-network
      - data-network
    depends_on:
      hoppscotch-migrate:
        condition: service_completed_successfully

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
  hoppscotch-migrate:
    image: hoppscotch/hoppscotch:latest
    container_name: hoppscotch-migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/hoppscotch_db"
    entrypoint: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks:
      - tools-network
      - data-network
    depends_on:
      postgres:
        condition: service_healthy
