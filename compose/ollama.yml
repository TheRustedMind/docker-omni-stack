services:
  ollama:
    image: ollama/ollama
    container_name: ${OLLAMA_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${VOL_OLLAMA_DATA:-${PROJECT_DATA_DIR:-../data}/ollama}:/root/.ollama

    networks:
      - ai-network

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:11434/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  ollama_data:
