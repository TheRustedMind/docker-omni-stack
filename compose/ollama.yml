services:
  ollama:
    image: ollama/ollama
    container_name: ${OLLAMA_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${VOL_OLLAMA_DATA:-${PROJECT_DATA_DIR:-../data}/ollama}:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT}:11434"
    networks:
      - project-network

volumes:
  ollama_data:
