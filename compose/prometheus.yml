services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - ${PROJECT_APPS_DIR:-../apps}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${VOL_PROMETHEUS_DATA:-${PROJECT_DATA_DIR:-../data}/prometheus}:/prometheus

    networks:
      - monitoring-network

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:9090/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  prometheus_data:
