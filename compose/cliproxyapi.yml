services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: ${CLIPROXYAPI_CONTAINER_NAME}
    restart: unless-stopped

    configs:
      - source: cliproxyapi_config
        target: /CLIProxyAPI/config.yaml
    volumes:
      - ${VOL_CLIPROXYAPI_AUTH:-${PROJECT_DATA_DIR:-../data}/cliproxyapi/auth}:/root/.cli-proxy-api
    networks:
      - automation-network

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:8317/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  cliproxyapi_auth:

configs:
  cliproxyapi_config:
    content: |
      host: "0.0.0.0"
      port: 8317
      auth-dir: "/root/.cli-proxy-api"
      api-keys:
        - "${CLIPROXYAPI_KEY:-n8n-local-key}"
      debug: true
