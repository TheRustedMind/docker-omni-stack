services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ${N8N_CONTAINER_NAME}
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
    volumes:
      - ${VOL_N8N_DATA:-${PROJECT_DATA_DIR:-../data}/n8n}:/home/node/.n8n
    networks:
      - automation-network

    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:5678/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  n8n_data:
