services:
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ${GOTENBERG_CONTAINER_NAME}
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-port=3000"

    networks:
      - processing-network
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
