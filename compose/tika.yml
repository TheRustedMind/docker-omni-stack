services:
  tika:
    image: apache/tika:latest
    container_name: ${TIKA_CONTAINER_NAME}
    restart: unless-stopped

    networks:
      - processing-network
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://localhost:9998/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
